name: Accadde Oggi

on:
  schedule:
    # 08:47 UTC = 10:47 in Italia con l'ora legale (09:47 con l'ora solare)
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova (crea il video ma non lo pubblica)"
        type: boolean
        default: true
      data:
        description: "Data da usare, es. 2026-10-16 (vuoto = oggi)"
        required: false

permissions:
  contents: write    
  models: read

concurrency:
  group: accadde-oggi
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa ffmpeg e font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Crea e pubblica lo Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          OGNI_QUANTI_GIORNI: ${{ vars.OGNI_QUANTI_GIORNI || '1' }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
          PROVA: ${{ inputs.prova && '1' || '0' }}
          DATA: ${{ inputs.data }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m accadde_oggi
       

      - name: Salva il video come allegato del giro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*.mp4
            output/ultimo-video.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Metti online il video per Zapier
        if: success() && hashFiles('output/release_tag.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat output/release_tag.txt)
          gh release create "$TAG" output/accadde-oggi-*.mp4 --title "$TAG" --notes-file output/ultimo-video.txt

      - name: Aggiorna lo storico
        if: success()
        run: |
          git config user.name "accadde-oggi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storico.json
          if [ -f feed.xml ]; then git add feed.xml; fi
          git diff --cached --quiet || (git commit -m "Storico: $(date -u +%F)" && git push)
