name: Accadde Oggi

on:
  # Orologio principale: cron-job.org chiama GitHub ogni giorno all'ora scelta
  repository_dispatch:
    types: [giro-giornaliero]
  # Si tengono sempre pronti i video dei prossimi 3 giorni; YouTube li pubblica da solo alle 10:00.
  # Un giro ogni ora: se manca qualcosa lo prepara, altrimenti si chiude in meno di un minuto.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova (crea il video ma non lo pubblica)"
        type: boolean
        default: true
      data:
        description: "Giorno di uscita, es. 2026-10-18 (vuoto = domani)"
        required: false

permissions:
  contents: write
  models: read

concurrency:
  group: accadde-oggi
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    continue-on-error: true   # niente giri rossi né email: il giro dopo recupera
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre l'ultima versione, con lo storico aggiornato dai giri precedenti

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa ffmpeg e font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Installa Claude Code (redattore)
        run: npm install -g @anthropic-ai/claude-code

      - name: Crea e pubblica lo Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          OGNI_QUANTI_GIORNI: ${{ vars.OGNI_QUANTI_GIORNI || '1' }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
          PROVA: ${{ inputs.prova && '1' || '0' }}
          DATA: ${{ inputs.data }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m accadde_oggi

      - name: Salva il video come allegato del giro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*.mp4
            output/ultimo-video.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Aggiorna lo storico
        if: always()
        run: |
          git config user.name "accadde-oggi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storico.json
          if [ -f feed.xml ]; then git add feed.xml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Storico: $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
          fi
          true
